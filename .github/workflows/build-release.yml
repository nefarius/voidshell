name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk

jobs:
  build:
    name: Build voidshell.elf
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash \
            clang-18 \
            lld-18 \
            wget \
            unzip \
            make \
            ca-certificates

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install ps5-payload-sdk
        run: |
          wget -q -O /tmp/ps5-payload-sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip"
          sudo unzip -q -o /tmp/ps5-payload-sdk.zip -d /opt
          test -f "${PS5_PAYLOAD_SDK}/toolchain/prospero.mk"
          echo "SDK ready at ${PS5_PAYLOAD_SDK}"

      - name: Build frontend (Preact / Bun)
        run: |
          cd ui
          bun install --frozen-lockfile
          bun run build
          test -f ../www/index.html
          # Keep root index.html in sync for deploy docs and legacy paths
          cp ../www/index.html ../index.html
          # Sanity: must be the bundled Preact build, not CDN React+Babel
          ! grep -q 'unpkg.com/react' ../www/index.html
          ! grep -q '@babel/standalone' ../www/index.html
          ls -lh ../www/index.html

      - name: Build ELF
        run: |
          export PS5_PAYLOAD_SDK="${PS5_PAYLOAD_SDK}"
          make clean
          make -j"$(nproc)"
          test -f build/voidshell.elf
          ls -lh build/voidshell.elf

      - name: Package release assets
        run: |
          mkdir -p dist
          cp build/voidshell.elf dist/voidshell.elf
          cp www/index.html dist/index.html
          (
            cd dist
            sha256sum voidshell.elf index.html > SHA256SUMS
          )
          cat dist/SHA256SUMS
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidshell
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/voidshell.elf
            dist/index.html
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
