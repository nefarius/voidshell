name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build voidshell.elf
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pinned SDK and bun versions live in the Dockerfile.
      - name: Build with Docker
        run: |
          docker buildx build --output type=local,dest=dist .
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidshell
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/voidshell.elf
            dist/index.html
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Fork build of [amilarajans/voidshell](https://github.com/amilarajans/voidshell) v1.1.1.

            The only change is a fix for the payload not loading on firmware that does not export
            `sceAppInstUtilAppInstallTitleDir` (observed on 13.40): the symbol is now resolved at runtime.
            See upstream PR [#2](https://github.com/amilarajans/voidshell/pull/2). Built reproducibly with
            the Dockerfile (ps5-payload-sdk v0.45). No support promise; prefer upstream once it ships the fix.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
