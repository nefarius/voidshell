name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build voidshell.elf
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pinned SDK and bun versions live in the Dockerfile.
      - name: Build with Docker
        run: |
          # A tag such as v1.1.1-nefarius.4 reports 1.1.1-nefarius.4 as "semver"; other builds keep the default in types.h.
          SEMVER=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            # SemVer 2.0 (no build metadata); the value is compiled into a C string and a 128-byte JSON buffer.
            SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if (( ${#SEMVER} > 97 )) || ! [[ "${SEMVER}" =~ ${SEMVER_RE} ]]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' is not a release SemVer tag (vMAJOR.MINOR.PATCH[-prerelease], at most 97 characters after the v)."
              exit 1
            fi
          fi
          docker buildx build --build-arg VOIDSHELL_SEMVER="${SEMVER}" --output type=local,dest=dist .
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidshell
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/voidshell.elf
            dist/index.html
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Fork build of [amilarajans/voidshell](https://github.com/amilarajans/voidshell) v1.1.1.

            Changes: a fix for the payload not loading on firmware that does not export
            `sceAppInstUtilAppInstallTitleDir` (observed on 13.40): the symbol is now resolved at runtime
            (upstream PR [#2](https://github.com/amilarajans/voidshell/pull/2)), a `running_app` field, and a
            `firmware` field (e.g. `"13.40"`) in `GET /api/stats`. Built reproducibly with
            the Dockerfile (ps5-payload-sdk v0.45). No support promise; prefer upstream once it ships the fix.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
